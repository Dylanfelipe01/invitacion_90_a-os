<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia - 90 Años María Araminta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #C6923B;
      --gold-dark: #8C5D19;
      --gold-light: #F4E2B2;
      --cream-bg: #FCF9F2;
      --card-bg: #FFFFFF;
      --text-dark: #3A2F25;
      --text-muted: #6B5E52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream-bg);
      background-image: radial-gradient(var(--gold-light) 0.8px, transparent 0.8px);
      background-size: 24px 24px;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .invite-card {
      background: var(--card-bg);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      padding: 36px 28px;
      box-shadow: 0 15px 40px rgba(140, 93, 25, 0.12);
      border: 2px solid var(--gold-light);
      position: relative;
      text-align: center;
    }

    .invite-card::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 10px;
      right: 10px;
      border: 1px dashed var(--gold-primary);
      border-radius: 14px;
      pointer-events: none;
      opacity: 0.55;
    }

    .ornament-top {
      font-size: 1.6rem;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    .years-badge {
      font-family: 'Cinzel', serif;
      font-size: 3.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 50%, #E8BE68 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 2px;
    }

    .subtitle-badge {
      font-family: 'Cinzel', serif;
      letter-spacing: 2.5px;
      font-size: 0.72rem;
      color: var(--gold-dark);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .invitation-to {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .honoree {
      font-family: 'Great Vibes', cursive;
      font-size: 2.6rem;
      color: var(--gold-dark);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .event-details {
      background: #FDFBF7;
      border: 1px solid var(--gold-light);
      border-radius: 12px;
      padding: 14px;
      margin: 0 auto 24px auto;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .event-details strong {
      color: var(--text-dark);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold-dark);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gold-light);
      border-radius: 8px;
      background: #FFF;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      transition: all 0.25s ease;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(198, 146, 59, 0.15);
    }

    .choice-container {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .choice-label {
      flex: 1;
      cursor: pointer;
      position: relative;
    }

    .choice-label input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border: 2px solid var(--gold-light);
      border-radius: 10px;
      background: #FFF;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
      transition: all 0.2s ease;
      text-align: center;
    }

    .choice-label input[type="radio"]:checked + .choice-btn {
      border-color: var(--gold-primary);
      background: linear-gradient(135deg, #F9F3E8 0%, #FFF 100%);
      color: var(--gold-dark);
      box-shadow: 0 4px 12px rgba(198, 146, 59, 0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(140, 93, 25, 0.25);
      transition: all 0.25s ease;
      margin-top: 6px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(140, 93, 25, 0.35);
    }

    .footer-quote {
      margin-top: 22px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="invite-card">
    <div class="ornament-top">❧ ❦ ❧</div>
    <div class="years-badge">90</div>
    <div class="subtitle-badge">Años de una vida extraordinaria</div>

    <p class="invitation-to">Celebración en honor a</p>
    <h1 class="honoree">María Araminta Molina</h1>

    <div class="event-details">
      🗓️ <strong>Domingo, 6 de diciembre de 2026</strong><br>
      ⏰ 2:00 p. m. a 8:00 p. m.<br>
      📍 <strong>Salones Recepciones Abella</strong> — Piso 2<br>
      Avenida Carrera 30 # 1 C - 39 (Barrio Santa Isabel)
    </div>

    <!-- Reemplaza XXXXXXXX con tu ID de Formspree -->
    <form action="https://formspree.io/f/xbggvnel" method="POST">
      <input type="hidden" name="_subject" value="Nueva confirmación: 90 años María Araminta">

      

      <div class="form-group">
        <label>¿Asistirás a la celebración?</label>
        <div class="choice-container">
          <label class="choice-label">
            <input type="radio" name="asistencia" value="SÍ, asistiré con gusto" required>
            <span class="choice-btn">✨ Sí asistiré</span>
          </label>
          <label class="choice-label">
            <input type="radio" name="asistencia" value="NO, no podré asistir">
            <span class="choice-btn">❌ No podré</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Enviar Confirmación</button>
    </form>

    <div class="footer-quote">
      Tu presencia es el regalo más hermoso
    </div>
  </div>

</body>
</html>
